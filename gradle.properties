# Project identity. Release automation overrides traceboxVersion from the tag.
traceboxGroup=io.github.tracebox
traceboxVersion=0.1.0-alpha.3

# Gradle behavior.
org.gradle.caching=true
org.gradle.parallel=true
# Release verification reads sources and AAR bytes at execution time.
org.gradle.configuration-cache=false
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

android.nonTransitiveRClass=true
android.useAndroidX=true
kotlin.code.style=official
