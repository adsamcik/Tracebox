# Project identity. Release automation overrides traceboxVersion from the tag.
traceboxGroup=io.github.tracebox
traceboxVersion=0.1.0-alpha.1

# Gradle behavior.
org.gradle.caching=true
org.gradle.parallel=true
# The release-verification tasks inspect source and AAR bytes at execution time.
# Keep configuration cache disabled until they are rewritten with cache-safe task inputs.
org.gradle.configuration-cache=false
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Android Gradle Plugin 9 uses its supported built-in Kotlin integration.
android.builtInKotlin=true
android.nonTransitiveRClass=true
android.useAndroidX=true
