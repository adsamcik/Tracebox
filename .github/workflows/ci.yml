name: foundation-ci

on:
  push:
    branches: ["copilot/tracebox-foundation"]
  pull_request:

permissions:
  contents: read

jobs:
  phase0:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21.0.8+9"
      - name: Install pinned Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component clippy,rustfmt --target aarch64-linux-android,x86_64-linux-android
          rustup override set 1.93.1
      - name: Install pinned Android tools
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358" "cmake;4.1.2"
      - name: Phase 0 presubmit
        shell: pwsh
        run: tools\ci\presubmit.ps1
