name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-readiness:
    name: required host readiness
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Install pinned Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component clippy,rustfmt
          rustup override set 1.93.1
      - name: Install pinned Android tools
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358" "cmake;4.1.2"
      - name: Run complete bounded host readiness
        shell: pwsh
        run: >-
          tools\verify\Invoke-Phase5HostReadiness.ps1
          -PrimeDependencies
          -Output build\reports\host-readiness.json
      - name: Ensure dependency integrity files are committed
        shell: pwsh
        run: |
          if (-not (Test-Path gradle/verification-metadata.xml)) { throw "Missing dependency verification metadata" }
          if (-not (Get-ChildItem -Recurse -Filter gradle.lockfile | Select-Object -First 1)) { throw "Missing dependency lockfiles" }
          if (git status --porcelain) { throw "Verification changed tracked files" }
