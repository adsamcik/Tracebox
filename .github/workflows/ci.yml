name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platform
        shell: bash
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Build, test, and inspect release AARs
        run: >-
          ./gradlew --no-daemon --stacktrace --dependency-verification=strict
          check

      - name: Ensure dependency integrity files are committed
        shell: bash
        run: |
          test -f gradle/verification-metadata.xml
          test -n "$(find . -name gradle.lockfile -print -quit)"
          test -z "$(git status --porcelain)"
