name: Finalize alpha release draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated alpha tag whose GitHub release is still a draft
        required: true
        type: string

permissions: {}

concurrency:
  group: alpha-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  finalize:
    name: verify package and finalize draft
    runs-on: ubuntu-24.04
    environment:
      name: github-packages-alpha
    permissions:
      contents: write
      packages: read

    steps:
      - name: Check out requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platform
        shell: bash
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Validate recoverable alpha draft
        id: recover_preflight
        env:
          GH_TOKEN: ${{ github.token }}
          TRACEBOX_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$TRACEBOX_TAG"
          version="${tag#v}"

          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]
          test "$(git cat-file -t "refs/tags/$tag")" = "tag"
          tag_object="$(git rev-parse "refs/tags/$tag")"
          release_commit="$(git rev-list -n 1 "$tag")"
          test "$release_commit" = "$(git rev-parse HEAD)"
          test "$(./gradlew -q -PtraceboxVersion="$version" printVersion)" = "$version"
          git merge-base --is-ancestor "$release_commit" origin/main
          remote_tag_object="$(git ls-remote --refs origin "refs/tags/$tag" | awk '{print $1}')"
          test "$remote_tag_object" = "$tag_object"
          echo "tag_object=$tag_object" >> "$GITHUB_OUTPUT"
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true

      - name: Rebuild and checksum tagged release contents
        env:
          TRACEBOX_RELEASE_TAG: ${{ inputs.tag }}
          TRACEBOX_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TRACEBOX_TAG#v}"
          ./gradlew --no-daemon --stacktrace --dependency-verification=strict \
            -PtraceboxGitHubRepository="${{ github.repository }}" \
            -PtraceboxVersion="$version" \
            verifyReleaseMetadata check createReleaseChecksums

      - name: Confirm both immutable packages are consumable
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACEBOX_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TRACEBOX_TAG#v}"
          maven_repository="${GITHUB_REPOSITORY,,}"
          maven_base="https://maven.pkg.github.com/$maven_repository/io/github/tracebox"

          await_artifact() {
            local url="$1"
            for attempt in {1..12}; do
              if curl --fail --location --silent --show-error --output /dev/null \
                --user "$GITHUB_ACTOR:$GITHUB_TOKEN" "$url"; then
                return 0
              fi
              if [[ $attempt -lt 12 ]]; then
                sleep 5
              fi
            done
            echo "Package artifact was not consumable from $url"
            return 1
          }

          for artifact in tracebox-api tracebox; do
            await_artifact "$maven_base/$artifact/$version/$artifact-$version.pom"
            await_artifact "$maven_base/$artifact/$version/$artifact-$version.aar"
          done

      - name: Resolve GitHub Packages as a clean Gradle consumer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACEBOX_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TRACEBOX_TAG#v}"
          ./gradlew --no-daemon --stacktrace \
            -p integration/consumer-smoke \
            -PtraceboxGitHubRepository="${{ github.repository }}" \
            -PtraceboxVersion="$version" \
            resolvePublishedArtifacts

      - name: Upload assets and publish draft
        env:
          GH_TOKEN: ${{ github.token }}
          TRACEBOX_TAG: ${{ inputs.tag }}
          TRACEBOX_EXPECTED_TAG_OBJECT: ${{ steps.recover_preflight.outputs.tag_object }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$TRACEBOX_TAG"
          version="${tag#v}"
          remote_tag_object="$(git ls-remote --refs origin "refs/tags/$tag" | awk '{print $1}')"
          test "$remote_tag_object" = "$TRACEBOX_EXPECTED_TAG_OBJECT"
          gh release upload "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            android/tracebox-api/build/outputs/aar/tracebox-api-release.aar \
            android/tracebox/build/outputs/aar/tracebox-release.aar \
            "build/release/tracebox-$version-sha256sums.txt" \
            LICENSE \
            NOTICE \
            THIRD_PARTY_NOTICES.md
          remote_tag_object="$(git ls-remote --refs origin "refs/tags/$tag" | awk '{print $1}')"
          test "$remote_tag_object" = "$TRACEBOX_EXPECTED_TAG_OBJECT"
          gh release edit "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease
