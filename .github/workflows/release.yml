name: Publish alpha release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated alpha tag with no GitHub release or published packages
        required: true
        type: string

permissions: {}

concurrency:
  group: alpha-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish GitHub Packages alpha
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: github-packages-alpha
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out immutable tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned Rust Android targets
        shell: bash
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component clippy,rustfmt
          rustup target add --toolchain 1.93.1 \
            aarch64-linux-android armv7-linux-androideabi \
            i686-linux-android x86_64-linux-android
          rustup override set 1.93.1
          cargo --version

      - name: Install Android SDK platform
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0" \
            "ndk;28.2.13676358" "cmake;4.1.2"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Validate immutable alpha tag and release state
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          TRACEBOX_EVENT_COMMIT: ${{ github.sha }}
          TRACEBOX_EVENT_NAME: ${{ github.event_name }}
          TRACEBOX_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$TRACEBOX_TAG"
          version="${tag#v}"

          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]
          test "$(git cat-file -t "refs/tags/$tag")" = "tag"
          tag_object="$(git rev-parse "refs/tags/$tag")"
          release_commit="$(git rev-list -n 1 "$tag")"
          if [[ "$TRACEBOX_EVENT_NAME" == "push" ]]; then
            test "$release_commit" = "$TRACEBOX_EVENT_COMMIT"
          fi
          test "$(git rev-parse HEAD)" = "$release_commit"
          test "$(./gradlew -q --dependency-verification=strict -PtraceboxVersion="$version" printVersion)" = "$version"
          git merge-base --is-ancestor "$release_commit" origin/main
          remote_tag_object="$(git ls-remote --refs origin "refs/tags/$tag" | awk '{print $1}')"
          test "$remote_tag_object" = "$tag_object"
          echo "tag_object=$tag_object" >> "$GITHUB_OUTPUT"

          lookup="$(mktemp)"
          set +e
          gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >"$lookup" 2>&1
          lookup_status=$?
          set -e
          if [[ $lookup_status -eq 0 ]]; then
            echo "A GitHub release or draft already exists for $tag."
            cat "$lookup"
            echo "Use the controlled recovery workflow for a draft; never overwrite a published release."
            exit 1
          fi
          if ! grep -Eq 'HTTP/[0-9.]+ 404|HTTP 404' "$lookup"; then
            echo "Could not determine whether $tag already has a GitHub release."
            cat "$lookup"
            exit "$lookup_status"
          fi

      - name: Verify, test, and checksum release contents
        env:
          TRACEBOX_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TRACEBOX_RELEASE_TAG#v}"
          ./gradlew --no-daemon --stacktrace --dependency-verification=strict \
            -PtraceboxGitHubRepository="${{ github.repository }}" \
            -PtraceboxVersion="$version" \
            verifyReleaseMetadata check createReleaseChecksums

      - name: Confirm GitHub Packages coordinates are unused
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACEBOX_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TRACEBOX_TAG#v}"
          maven_repository="${GITHUB_REPOSITORY,,}"
          maven_base="https://maven.pkg.github.com/$maven_repository/io/github/tracebox"
          artifacts=(
            tracebox-api tracebox-core tracebox-storage tracebox-directboot
            tracebox-anr-exit tracebox-native tracebox-export tracebox-export-ui
            tracebox-ui-compose tracebox
          )
          for artifact in "${artifacts[@]}"; do
            url="$maven_base/$artifact/$version/$artifact-$version.pom"
            status="$(curl --location --silent --show-error --output /dev/null \
              --write-out '%{http_code}' \
              --user "$GITHUB_ACTOR:$GITHUB_TOKEN" "$url")"
            if [[ "$status" != "404" ]]; then
              echo "Refusing to publish $artifact:$version: Maven metadata returned HTTP $status."
              echo "Use a new alpha version, or recover an existing draft without republishing."
              exit 1
            fi
          done

      - name: Create protected alpha draft
        env:
          GH_TOKEN: ${{ github.token }}
          TRACEBOX_EXPECTED_TAG_OBJECT: ${{ steps.preflight.outputs.tag_object }}
          TRACEBOX_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$TRACEBOX_TAG"
          version="${tag#v}"
          remote_tag_object="$(git ls-remote --refs origin "refs/tags/$tag" | awk '{print $1}')"
          test "$remote_tag_object" = "$TRACEBOX_EXPECTED_TAG_OBJECT"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tracebox $version" \
            --draft \
            --prerelease \
            --verify-tag \
            --generate-notes

      - name: Publish immutable GitHub Packages artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACEBOX_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TRACEBOX_RELEASE_TAG#v}"
          ./gradlew --no-daemon --stacktrace --dependency-verification=strict \
            -PtraceboxGitHubRepository="${{ github.repository }}" \
            -PtraceboxVersion="$version" \
            publishFoundation

      - name: Verify GitHub Packages consumer endpoints
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACEBOX_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TRACEBOX_TAG#v}"
          maven_repository="${GITHUB_REPOSITORY,,}"
          maven_base="https://maven.pkg.github.com/$maven_repository/io/github/tracebox"

          await_artifact() {
            local url="$1"
            for attempt in {1..12}; do
              if curl --fail --location --silent --show-error --output /dev/null \
                --user "$GITHUB_ACTOR:$GITHUB_TOKEN" "$url"; then
                return 0
              fi
              if [[ $attempt -lt 12 ]]; then
                sleep 5
              fi
            done
            echo "Published package was not consumable from $url"
            return 1
          }

          artifacts=(
            tracebox-api tracebox-core tracebox-storage tracebox-directboot
            tracebox-anr-exit tracebox-native tracebox-export tracebox-export-ui
            tracebox-ui-compose tracebox
          )
          for artifact in "${artifacts[@]}"; do
            await_artifact "$maven_base/$artifact/$version/$artifact-$version.pom"
            await_artifact "$maven_base/$artifact/$version/$artifact-$version.aar"
          done

      - name: Resolve GitHub Packages as a clean Gradle consumer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACEBOX_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TRACEBOX_TAG#v}"
          ./gradlew --no-daemon --stacktrace \
            -p integration/consumer-smoke \
            -PtraceboxGitHubRepository="${{ github.repository }}" \
            -PtraceboxVersion="$version" \
            -PtraceboxExpectedArtifactRoot="$GITHUB_WORKSPACE" \
            resolvePublishedArtifacts

      - name: Upload assets to alpha draft
        env:
          GH_TOKEN: ${{ github.token }}
          TRACEBOX_EXPECTED_TAG_OBJECT: ${{ steps.preflight.outputs.tag_object }}
          TRACEBOX_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$TRACEBOX_TAG"
          version="${tag#v}"
          remote_tag_object="$(git ls-remote --refs origin "refs/tags/$tag" | awk '{print $1}')"
          test "$remote_tag_object" = "$TRACEBOX_EXPECTED_TAG_OBJECT"
          gh release upload "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            android/tracebox-anr-exit/build/outputs/aar/tracebox-anr-exit-release.aar \
            android/tracebox-api/build/outputs/aar/tracebox-api-release.aar \
            android/tracebox-core/build/outputs/aar/tracebox-core-release.aar \
            android/tracebox-directboot/build/outputs/aar/tracebox-directboot-release.aar \
            android/tracebox-export/build/outputs/aar/tracebox-export-release.aar \
            android/tracebox-export-ui/build/outputs/aar/tracebox-export-ui-release.aar \
            android/tracebox-native/build/outputs/aar/tracebox-native-release.aar \
            android/tracebox-storage/build/outputs/aar/tracebox-storage-release.aar \
            android/tracebox-ui-compose/build/outputs/aar/tracebox-ui-compose-release.aar \
            android/tracebox/build/outputs/aar/tracebox-release.aar \
            "build/release/tracebox-$version-sha256sums.txt" \
            LICENSE \
            NOTICE \
            THIRD_PARTY_NOTICES.md

      - name: Publish verified alpha draft
        env:
          GH_TOKEN: ${{ github.token }}
          TRACEBOX_EXPECTED_TAG_OBJECT: ${{ steps.preflight.outputs.tag_object }}
          TRACEBOX_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$TRACEBOX_TAG"
          remote_tag_object="$(git ls-remote --refs origin "refs/tags/$tag" | awk '{print $1}')"
          test "$remote_tag_object" = "$TRACEBOX_EXPECTED_TAG_OBJECT"
          gh release edit "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease
