name: Emulator qualification

on:
  workflow_dispatch:
    inputs:
      serial:
        description: Connected rootable API 36 x86_64 emulator serial
        required: true
        type: string
      full_diagnostic_suite:
        description: Run advisory scenarios in addition to the required representative smoke
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: emulator-qualification
  cancel-in-progress: false

jobs:
  representative-emulator:
    name: bounded representative emulator qualification
    runs-on: [self-hosted, windows, x64, tracebox-emulator]
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825a76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run representative emulator contract
        shell: pwsh
        env:
          TRACEBOX_EMULATOR_SERIAL: ${{ inputs.serial }}
          TRACEBOX_FULL_DIAGNOSTIC_SUITE: ${{ inputs.full_diagnostic_suite }}
        run: |
          $arguments = @(
            '-Serial', $env:TRACEBOX_EMULATOR_SERIAL,
            '-Output', 'build\reports\emulator-qualification.json'
          )
          if ($env:TRACEBOX_FULL_DIAGNOSTIC_SUITE -eq 'true') {
            $arguments += '-FullDiagnosticSuite'
          }
          & tools\verify\Invoke-PersonalReleaseEmulator.ps1 @arguments
